name: Release NPM Packages

# Published GitHub releases drive npm publishing.
on:
  release:
    types: [published]
  workflow_dispatch:

# Keep one publish run per tag.
concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Reuse the npm build/test workflow so release artifacts come from the tested build.
  build:
    uses: ./.github/workflows/npm-build-test.yml

  publish:
    name: Publish npm packages
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      # Needed for main package assets and validation scripts.
      - name: checkout
        uses: actions/checkout@v4

      # Configure npm registry auth; publish uses NODE_AUTH_TOKEN below.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Download artifact containers uploaded by npm-build-test; their contents are .tgz files.
      - name: Download npm tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: nodejs-*-${{ github.run_id }}
          path: dist/npm
          merge-multiple: true

      # Show the actual npm tarballs after artifact extraction.
      - name: List npm tarballs
        run: |
          find dist/npm -maxdepth 2 -name '*.tgz' -print | sort

      # Assemble the pure-JS main package that depends on platform packages.
      - name: Prepare main package
        run: |
          MAIN_DIR="dist/npm-main"
          mkdir -p "$MAIN_DIR"
          cp tools/nodejs_bind/assets/package.json "$MAIN_DIR/package.json"
          cp tools/nodejs_bind/assets/index.js "$MAIN_DIR/index.js"

      # Validate package metadata, unpack platform packages, then publish all packages.
      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail

          # The tag version must match every package version before publish is attempted.
          # release-vX.Y.Z -> X.Y.Z ; vX.Y.Z -> X.Y.Z
          VERSION="${RELEASE_TAG#release-}"
          VERSION="${VERSION#v}"

          PLATFORMS=(linux-x86_64 linux-arm64 osx-arm64 osx-x86_64 windows-x86_64 windows-arm64)

          for plat in "${PLATFORMS[@]}"; do
            tgz=(dist/npm/kuwork-neug-"$plat"-*.tgz)
            if [ ! -f "${tgz[0]}" ]; then
              echo "Missing npm tarball for $plat"
              exit 1
            fi
            pkg_dir="dist/npm-packages/$plat/package"
            rm -rf "dist/npm-packages/$plat"
            mkdir -p "dist/npm-packages/$plat"
            tar -xzf "${tgz[0]}" -C "dist/npm-packages/$plat"
            python3 tools/nodejs_bind/scripts/validate_npm_version.py \
              "$pkg_dir" "@kuwork/neug-$plat" "$VERSION"
            npm publish "$pkg_dir" --access public
          done

          # Validate the main package: version + every optional dependency version.
          python3 tools/nodejs_bind/scripts/validate_npm_version.py \
            dist/npm-main '@kuwork/neug' "$VERSION" \
            --optional-dependency '@kuwork/neug-linux-x86_64' \
            --optional-dependency '@kuwork/neug-linux-arm64' \
            --optional-dependency '@kuwork/neug-osx-arm64' \
            --optional-dependency '@kuwork/neug-osx-x86_64' \
            --optional-dependency '@kuwork/neug-windows-x86_64' \
            --optional-dependency '@kuwork/neug-windows-arm64'

          npm publish ./dist/npm-main --access public
